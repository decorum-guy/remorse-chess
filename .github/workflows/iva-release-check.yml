name: Iva Games release images

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Iva Games platform]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: iva-release-check-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  image:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      packages: read
    name: ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: chess
            dockerfile: Dockerfile
          - service: platform
            dockerfile: Dockerfile.platform
          - service: realtime
            dockerfile: Dockerfile.realtime
    env:
      IMAGE_KIND: ${{ matrix.service }}
      IMAGE_DOCKERFILE: ${{ matrix.dockerfile }}
      IMAGE_TAG: iva-games-check:${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_CONTAINER: iva-release-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_VOLUME: iva-release-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}-data
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate deployment Compose and Caddy configuration
        if: matrix.service == 'platform'
        run: |
          set -euo pipefail
          umask 077
          config_dir="$(mktemp -d "$RUNNER_TEMP/iva-config.XXXXXX")"
          trap 'rm -rf -- "$config_dir"' EXIT
          # Configuration-only fixtures: no credentials, recipients or delivery.
          cat > "$config_dir/platform.env" <<'ENV'
          SMTP_HOST=mail.invalid
          SMTP_PORT=465
          SMTP_SECURE=true
          SMTP_FROM=ci@example.invalid
          TELEGRAM_ENABLED=false
          ENV
          docker pull caddy:2
          caddy_image="$(docker image inspect caddy:2 --format '{{index .RepoDigests 0}}')"
          cat > "$config_dir/release.env" <<ENV
          CHESS_IMAGE=iva-games-config-check:chess
          PLATFORM_IMAGE=iva-games-config-check:platform
          CADDY_IMAGE=$caddy_image
          PLATFORM_ENV_FILE=$config_dir/platform.env
          IVA_NETWORK_SUBNET=172.30.239.0/24
          IVA_NETWORK_DYNAMIC_RANGE=172.30.239.128/25
          CADDY_PROXY_IP=172.30.239.2
          CHESS_DATA_VOLUME=iva-config-chess-data
          PLATFORM_DATA_VOLUME=iva-config-platform-data
          CADDY_DATA_VOLUME=iva-config-caddy-data
          CADDY_CONFIG_VOLUME=iva-config-caddy-config
          ENV
          docker compose version --short
          IVA_RELEASE_ENV="$config_dir/release.env" deploy/iva-games/compose.sh config --quiet
          # Validate provisioning only: never start listeners or obtain certificates.
          # The container has no external network, published ports or persistent data.
          docker run --rm --network none --read-only \
            --tmpfs /data --tmpfs /config --tmpfs /tmp \
            --mount "type=bind,src=$GITHUB_WORKSPACE/deploy/iva-games/Caddyfile,dst=/etc/caddy/Caddyfile,readonly" \
            --entrypoint caddy "$caddy_image" validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Collect actual saved realtime versions from the deployed image
        if: matrix.service == 'realtime'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          python3 -B deploy/iva-games/prepare-realtime-image.py

      - name: Build runtime image from the checked-out revision
        run: |
          set -euo pipefail
          retained=()
          if [[ "$IMAGE_KIND" = realtime ]]; then
            retained=(--build-context "realtime-retained=$GITHUB_WORKSPACE/deploy/iva-games/retained-input/current")
          fi
          docker build --pull --build-arg VCS_REF="$(git rev-parse HEAD)" \
            --file "$IMAGE_DOCKERFILE" --tag "$IMAGE_TAG" "${retained[@]}" .

      - name: Check isolated production runtime and persistent volume
        run: |
          set -euo pipefail
          deploy/iva-games/verify-image.sh

  publish:
    needs: image
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: chess
            dockerfile: Dockerfile
          - service: platform
            dockerfile: Dockerfile.platform
          - service: realtime
            dockerfile: Dockerfile.realtime
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SERVICE: ${{ matrix.service }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Publish the reviewed main revision
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY}-$SERVICE:$RELEASE_SHA"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Reusing the existing immutable SHA tag for $SERVICE."
            exit 0
          fi
          retained=()
          if [[ "$SERVICE" = realtime ]]; then
            python3 -B deploy/iva-games/prepare-realtime-image.py
            retained=(--build-context "realtime-retained=$GITHUB_WORKSPACE/deploy/iva-games/retained-input/current")
          fi
          read -r inputs compatibility < <(deploy/iva-games/image-inputs.sh "$SERVICE")
          docker build --pull --platform linux/amd64 --file "$DOCKERFILE" \
            --build-arg VCS_REF="$RELEASE_SHA" \
            --label "org.iva-games.inputs=$inputs" \
            --label "org.iva-games.compatibility=$compatibility" --tag "$image" "${retained[@]}" .
          export IMAGE_KIND="$SERVICE" IMAGE_TAG="$image"
          export SMOKE_CONTAINER="iva-publish-$SERVICE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export SMOKE_VOLUME="$SMOKE_CONTAINER-data"
          deploy/iva-games/verify-image.sh
          docker push "$image"


  deploy:
    needs: publish
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    environment: production
    concurrency:
      group: iva-games-vps
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VPS_HOST: ${{ vars.IVA_SSH_HOST }}
      VPS_PORT: ${{ vars.IVA_SSH_PORT }}
      VPS_HOST_KEY: ${{ vars.IVA_SSH_HOST_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Promote the reviewed image digests
        id: promote
        env:
          DEPLOY_KEY: ${{ secrets.IVA_DEPLOY_SSH_KEY }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          config="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "$config"' EXIT
          test -n "$DEPLOY_KEY" && test -n "$VPS_HOST_KEY"
          printf '%s\n' "$DEPLOY_KEY" > "$config/key"
          printf '%s\n' "$VPS_HOST_KEY" > "$config/known_hosts"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          main_sha="$(python3 -B deploy/iva-games/github-main.py)"
          if [[ "$main_sha" != "$RELEASE_SHA" ]]; then
            echo "A newer main revision superseded this run."
            exit 0
          fi
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          digest() {
            docker buildx imagetools inspect --format '{{json .Manifest}}' \
              "ghcr.io/${GITHUB_REPOSITORY}-$1:$RELEASE_SHA" | jq -er .digest
          }
          chess="$(digest chess)"
          platform="$(digest platform)"
          realtime="$(digest realtime)"
          # The server validates evidence against GitHub and GHCR independently.
          # The short-lived token also authenticates server-side GitHub evidence
          # checks. It goes via stdin, never argv, and is not persisted on VPS.
          for attempt in 1 2 3; do
            status=0
            printf '%s %s %s %s\n%s\n' "$RELEASE_SHA" "$chess" "$platform" "$realtime" "$REGISTRY_TOKEN" |
              ssh -T -p "$VPS_PORT" -i "$config/key" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o ControlMaster=no -o ControlPath=none -o ConnectTimeout=10 \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$config/known_hosts" \
                "iva-deploy@$VPS_HOST" | tee "$config/outcome" || status=$?
            if [[ "$status" == 0 ]]; then
              if grep -Fxq "DEPLOYED $RELEASE_SHA" "$config/outcome" ||
                 grep -Fxq 'UNCHANGED release already current' "$config/outcome"; then
                # UNCHANGED permits a retry of the public check; it alone is
                # not a claim of first delivery or completed initial activation.
                echo 'check_catalogue=true' >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if [[ "$status" != 75 ]]; then exit "$status"; fi
            sleep "$((attempt * 10))"
          done
          exit 75
      - uses: actions/setup-node@v7
        if: steps.promote.outputs.check_catalogue == 'true'
        with:
          node-version: '24'
      - name: Verify the public game profile matches this release
        if: steps.promote.outputs.check_catalogue == 'true'
        run: node --experimental-strip-types scripts/check-live-catalogue.mjs https://iva-games.pro
