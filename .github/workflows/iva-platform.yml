name: Iva Games platform

on:
  pull_request:
  push:
    branches: [main, feat/iva-platform-foundation]

permissions:
  contents: read

concurrency:
  group: iva-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The territorial game exercises the real paced bots, including trade response windows.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --test apps/realtime-server/tests/profiling-scripts.test.mjs apps/realtime-server/tests/storage-diagnostic.test.mjs
      - run: python3 -B -m unittest discover -s deploy/iva-games -p 'test_*.py'
      - run: npx vite build --config games/district/vite.territorial-simulation.config.ts
      - run: node .qa/territorial-runner/simulate.mjs --bot-audit --map=azure-bay --samples=6
      - run: npm run build:all
      - name: Check real realtime admission, controller transfer and recovery
        run: node apps/realtime-server/scripts/network-smoke.mjs
      - run: npm run platform:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run chess-home:e2e -- --workers=1
      - run: npm run portal:e2e -- --workers=1
      - run: node scripts/profile-avatar-browser.mjs
      - run: npm run district:browser
      - run: node scripts/district-interface-browser.mjs
      - run: node scripts/district-trade-browser.mjs
      - run: node scripts/district-compact-trade-browser.mjs
      - run: node scripts/district-audio-browser.mjs
      - run: node scripts/district-territorial-browser.mjs
      # QA output stays in the job logs. No upload-artifact or video/trace storage.

  overdrive-tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check the short tutorial and saved/online game isolation
        run: >-
          npx playwright test --config games/chess/overdrive/playwright.config.ts tutorial.spec.ts
          --project desktop-chromium --project mobile-chromium --project landscape-chromium

  forpost-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: interface, renderer: '3d' }
          - { scenario: FP01, renderer: '3d' }
          - { scenario: FP02, renderer: '3d' }
          - { scenario: FP03, renderer: '3d' }
          - { scenario: FP01, renderer: '2d' }
          - { scenario: FP02, renderer: '2d' }
          - { scenario: FP03, renderer: '2d' }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether Forpost or its shared runtime inputs changed
        id: changes
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              event = json.load(stream)
          base = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before')
          required = True
          if isinstance(base, str) and re.fullmatch('[0-9a-f]{40}', base) and base != '0' * 40:
              if subprocess.run(['git', 'cat-file', '-e', base], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                  subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], check=True)
              files = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, 'HEAD']).decode().split('\0')
              prefixes = ('games/forpost/', 'apps/realtime-server/', 'apps/platform/', 'apps/portal/',
                          'packages/realtime-kit/', 'packages/session-kit/', 'packages/game-registry/', 'scripts/forpost-')
              exact = {'package.json', 'package-lock.json', 'tsconfig.json', 'tsconfig.platform.json',
                       'vite.platform.config.ts', '.github/workflows/iva-platform.yml'}
              required = any(path.startswith(prefixes) or path in exact for path in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('required=' + str(required).lower() + '\n')
          PY
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.required == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.changes.outputs.required == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.required == 'true'
      - name: Exercise the actual Forpost client, platform and realtime processes
        if: steps.changes.outputs.required == 'true'
        env:
          FORPOST_SCENARIO: ${{ matrix.scenario }}
          FORPOST_MAP_RENDERER: ${{ matrix.renderer }}
        run: |
          # Each map has its own real server/database/browser process tree. This
          # tests UI outcomes; the independent four-room load probe tests capacity.
          if [ "$FORPOST_SCENARIO" = interface ]; then
            npm run forpost:e2e -- --workers=1 --grep-invert 'three complete network matches'
          else
            npm run forpost:e2e -- --workers=1 --grep "$FORPOST_SCENARIO: lobby"
          fi
      # Automated UI checks are distinct from the executor's own browser play.
      # No screenshot, video or trace upload is added to the release pipeline.

  forpost-core-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record the actual benchmark environment
        run: |
          node --input-type=module <<'JS'
          import os from 'node:os';
          import { readFileSync } from 'node:fs';
          const read = path => { try { return readFileSync(path, 'utf8').trim(); } catch { return 'unavailable'; } };
          console.log(JSON.stringify({ node: process.version, cpu: os.cpus()[0]?.model,
            availableParallelism: os.availableParallelism(), reportedMemoryBytes: os.totalmem(),
            cpuQuota: read('/sys/fs/cgroup/cpu.max'), memoryQuota: read('/sys/fs/cgroup/memory.max'),
            scope: 'CI maximum-scene probe; not a production capacity profile or a four-room hour' }));
          JS
      - name: Enforce the unchanged maximum-scene p99 budget
        env:
          FORPOST_PERF: '1'
        run: npx vitest run --config games/forpost/vitest.config.ts games/forpost/tests/core-load.test.ts --maxWorkers=1

  forpost-storage-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install the own-child syscall observation tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace
      - name: Diagnose the actual checkout disk with FULL SQLite durability
        run: >-
          timeout --signal=TERM --kill-after=5s 190s
          node apps/realtime-server/scripts/storage-diagnostic.mjs --trace=auto
      # Print only the sanitized summary. Never cat or upload private report,
      # source or raw files. This diagnosis is not a capacity acceptance.
      # The outer timeout also bounds non-abortable metadata/cleanup awaits.

  forpost-four-room-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: iva-forpost-load:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether load inputs changed
        id: load-changes
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              event = json.load(stream)
          base = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before')
          required = True
          if isinstance(base, str) and re.fullmatch('[0-9a-f]{40}', base) and base != '0' * 40:
              if subprocess.run(['git', 'cat-file', '-e', base], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                  subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], check=True)
              files = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, 'HEAD']).decode().split('\0')
              prefixes = ('games/forpost/', 'apps/realtime-server/', 'packages/realtime-kit/',
                          'packages/session-kit/', 'packages/game-registry/', 'deploy/iva-games/')
              exact = {'package.json', 'package-lock.json', 'tsconfig.json', 'tsconfig.platform.json',
                       'Dockerfile.realtime', '.github/workflows/iva-platform.yml'}
              required = any(path.startswith(prefixes) or path in exact for path in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('required=' + str(required).lower() + '\n')
          PY
      - uses: actions/setup-node@v7
        if: steps.load-changes.outputs.required == 'true'
        with:
          node-version: '24'
      - name: Prepare the retained runtime and client build input
        if: steps.load-changes.outputs.required == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          python3 -B deploy/iva-games/prepare-realtime-image.py
      - name: Build the exact production runtime and client
        if: steps.load-changes.outputs.required == 'true'
        run: |
          docker build --pull --build-arg VCS_REF="$(git rev-parse HEAD)" \
            --build-context "realtime-retained=$GITHUB_WORKSPACE/deploy/iva-games/retained-input/current" \
            --file Dockerfile.realtime --tag "$IMAGE_TAG" .
      - name: Measure four rooms for a real hour within two CPUs and two GiB
        if: steps.load-changes.outputs.required == 'true'
        env:
          FORPOST_QA_OUTPUT_DIRECTORY: ${{ runner.temp }}/forpost-load-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash apps/realtime-server/scripts/profile-image.sh --seconds=3600 --rooms=4
      # The runtime uses an explicit test-fixture admission profile for this
      # measurement. No production capacity profile is inferred or emitted.
      # The capped container has no external network or extra capabilities.
      # Sanitized measurements stay in logs; raw databases/reports are not uploaded.

  forpost-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Exercise settings, keyboard and tutorial actions in WebKit
        env:
          FORPOST_BROWSER: webkit
        run: npm run forpost:e2e -- interaction.spec.ts --workers=1
